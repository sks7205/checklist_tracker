name: Shift Checklist Automation

on:
  schedule:
    # 06:30 IST (C Shift) -> 01:00 UTC
    - cron: '0 1 * * *'
    # 14:30 IST (A Shift) -> 09:00 UTC
    - cron: '0 9 * * *'
    # 22:30 IST (B Shift) -> 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      shift:
        description: 'Shift to check (A, B, or C)'
        required: false
        default: ''

jobs:
  run-checklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run checklist script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${{ github.event.inputs.shift }}" ]; then
            python script.py --shift ${{ github.event.inputs.shift }}
          else
            python script.py
          fi
