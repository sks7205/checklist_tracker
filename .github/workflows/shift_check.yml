name: Shift Checklist Automation

on:
  schedule:
    # 06:30 IST (C Shift End) -> 01:00 UTC
    - cron: '0 1 * * *'
    # 14:30 IST (A Shift End) -> 09:00 UTC
    - cron: '0 9 * * *'
    # 22:30 IST (B Shift End) -> 17:00 UTC
    - cron: '0 17 * * *'

  workflow_dispatch:
    inputs:
      shift:
        description: 'Select Shift (A, B, or C)'
        required: true
        type: choice
        options:
          - A
          - B
          - C
        default: 'A'
      date:
        description: 'Date in DD/MM/YYYY format (Leave empty for default)'
        required: false
        default: ''

jobs:
  run-checklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run checklist script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.shift }}" ]; then
            ARGS="$ARGS --shift ${{ github.event.inputs.shift }}"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python script.py $ARGS
