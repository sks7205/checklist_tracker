name: Shift Checklist Automation

on:
  schedule:
    # 06:30 AM IST (C Shift) -> 01:00 UTC
    - cron: '0 1 * * *'
    # 02:30 PM IST (A Shift) -> 09:00 UTC
    - cron: '0 9 * * *'
    # 10:30 PM IST (B Shift) -> 17:00 UTC
    - cron: '0 17 * * *'

  workflow_dispatch:
    inputs:
      shift:
        description: 'Select Shift (A, B, or C)'
        required: true
        type: choice
        options:
          - A
          - B
          - C
        default: 'A'
      date:
        description: 'Date in DD/MM/YYYY format (Leave empty for default)'
        required: false
        default: ''

jobs:
  # -------------------------------------------------------------
  # Job 1: Manual / Cloudflare Worker Trigger
  # -------------------------------------------------------------
  manual-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Checklist
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ARGS="--shift ${{ github.event.inputs.shift }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python script.py $ARGS

  # -------------------------------------------------------------
  # Job 2: Scheduled Automatic Runs (Exact Shift Mapping)
  # -------------------------------------------------------------
  scheduled-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Determine Shift & Run
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Strip leading zeros and check time range (handles 0-45 min GitHub scheduler delays)
          UTC_HOUR=$((10#$(date -u +%H)))
          
          echo "Current UTC Hour: $UTC_HOUR"

          if [ "$UTC_HOUR" -ge 0 ] && [ "$UTC_HOUR" -le 4 ]; then
            echo "Executing Scheduled C Shift..."
            python script.py --shift C
          elif [ "$UTC_HOUR" -ge 8 ] && [ "$UTC_HOUR" -le 12 ]; then
            echo "Executing Scheduled A Shift..."
            python script.py --shift A
          elif [ "$UTC_HOUR" -ge 16 ] && [ "$UTC_HOUR" -le 20 ]; then
            echo "Executing Scheduled B Shift..."
            python script.py --shift B
          else
            echo "Fallback check based on script logic..."
            python script.py
          fi
