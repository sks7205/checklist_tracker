name: Shift Checklist Automation

on:
  schedule:
    # C Shift (06:30 AM IST) -> 01:00 UTC
    - cron: '0 1 * * *'
    # A Shift (02:30 PM IST) -> 09:00 UTC
    - cron: '0 9 * * *'
    # B Shift (10:30 PM IST) -> 17:00 UTC
    - cron: '0 17 * * *'

  workflow_dispatch:
    inputs:
      shift:
        description: 'Select Shift (A, B, or C)'
        required: true
        type: choice
        options:
          - A
          - B
          - C
        default: 'A'
      date:
        description: 'Date in DD/MM/YYYY format (Leave empty for default)'
        required: false
        default: ''

jobs:
  # -------------------------------------------------------------
  # Job 1: Manual or Cloudflare Worker Trigger
  # -------------------------------------------------------------
  manual-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Manual Checklist
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ARGS="--shift ${{ github.event.inputs.shift }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python script.py $ARGS

  # -------------------------------------------------------------
  # Job 2: Scheduled Shift Runs (Explicit Shift Mapping)
  # -------------------------------------------------------------
  scheduled-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Scheduled C Shift (06:30 AM IST)
        if: github.event.schedule == '0 1 * * *'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python script.py --shift C

      - name: Run Scheduled A Shift (02:30 PM IST)
        if: github.event.schedule == '0 9 * * *'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python script.py --shift A

      - name: Run Scheduled B Shift (10:30 PM IST)
        if: github.event.schedule == '0 17 * * *'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python script.py --shift B
