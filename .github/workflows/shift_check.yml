name: Shift Checklist Automation

on:
  schedule:
    # C Shift (Starts VM at 06:29 AM IST -> Triggers at 06:30 AM IST)
    - cron: '59 0 * * *'
    # A Shift (Starts VM at 02:29 PM IST -> Triggers at 02:30 PM IST)
    - cron: '59 8 * * *'
    # B Shift (Starts VM at 10:29 PM IST -> Triggers at 10:30 PM IST)
    - cron: '59 16 * * *'

  workflow_dispatch:
    inputs:
      shift:
        description: 'Select Shift (A, B, or C)'
        required: true
        type: choice
        options:
          - A
          - B
          - C
        default: 'A'
      date:
        description: 'Date in DD/MM/YYYY format (Leave empty for default)'
        required: false
        default: ''

jobs:
  # -------------------------------------------------------------
  # Job 1: Manual / Cloudflare Worker Trigger (Runs Immediately)
  # -------------------------------------------------------------
  manual-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Checklist
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ARGS="--shift ${{ github.event.inputs.shift }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python script.py $ARGS

  # -------------------------------------------------------------
  # Job 2: Scheduled Runs (Pre-warms 1 Min Early & Syncs to Exact Time)
  # -------------------------------------------------------------
  scheduled-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Pre-warming Environment)
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Sync to Exact Shift Time & Execute
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -c "
          import time
          from datetime import datetime, timezone, timedelta

          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          print(f'Runner ready at: {now.strftime(\"%H:%M:%S\")} IST')

          # Determine target shift and exact trigger target
          if now.hour == 6 or (now.hour == 5 and now.minute >= 55):
              shift = 'C'
              target_hour, target_min = 6, 30
          elif now.hour == 14 or (now.hour == 13 and now.minute >= 55):
              shift = 'A'
              target_hour, target_min = 14, 30
          elif now.hour == 22 or (now.hour == 21 and now.minute >= 55):
              shift = 'B'
              target_hour, target_min = 22, 30
          else:
              shift = 'A'
              target_hour, target_min = now.hour, now.minute

          target_time = now.replace(hour=target_hour, minute=target_min, second=0, microsecond=0)
          
          # If runner initialized early, wait for the exact scheduled second
          wait_seconds = (target_time - datetime.now(IST)).total_seconds()
          if wait_seconds > 0:
              print(f'Waiting {wait_seconds:.2f}s for exact trigger time ({target_hour:02d}:{target_min:02d}:00 IST)...')
              time.sleep(wait_seconds)

          print(f'Triggering {shift} Shift Checklist at: {datetime.now(IST).strftime(\"%H:%M:%S\")} IST')
          import subprocess
          subprocess.run(['python', 'script.py', '--shift', shift], check=True)
          "
          else
            echo "Fallback check based on script logic..."
            python script.py
          fi
