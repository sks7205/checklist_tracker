name: Shift Checklist Automation

on:
  # Backup only: GitHub's native schedule can be delayed by minutes to
  # hours under load, so this exists purely as a fallback in case the
  # Cloudflare Worker's cron-triggered workflow_dispatch call fails.
  # Kept 10 minutes behind the real target so it doesn't double-run
  # under normal conditions.
  schedule:
    - cron: '45 20 * * *'   # C shift fallback, 6:30 AM IST
    - cron: '30 04 * * *'   # A shift fallback, 2:30 PM IST
    - cron: '15 14 * * *'  # B shift fallback, 10:30 PM IST

  workflow_dispatch:
    inputs:
      shift:
        description: 'Select Shift (A, B, or C)'
        required: true
        type: choice
        options:
          - A
          - B
          - C
        default: 'A'
      date:
        description: 'Date in DD/MM/YYYY format (Leave empty for default)'
        required: false
        default: ''

jobs:
  # -------------------------------------------------------------
  # Job 1: Manual / Cloudflare Worker Trigger (Runs Immediately)
  # The Worker's cron calls this same workflow_dispatch endpoint at the
  # exact shift time, passing the correct shift - same path your /check
  # Telegram command already uses.
  # -------------------------------------------------------------
  manual-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Checklist
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ARGS="--shift ${{ github.event.inputs.shift }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python script.py $ARGS

  # -------------------------------------------------------------
  # Job 2: Scheduled Runs (Fallback only - runs 9-10 min after target,
  # in case the Cloudflare Worker's dispatch above didn't fire)
  # -------------------------------------------------------------
  scheduled-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Pre-warming Environment)
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Sync to Exact Shift Time & Execute
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python -c "
          import os, time, subprocess
          from datetime import datetime, timezone, timedelta

          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          schedule = os.getenv('SCHEDULE', '')
          print(f'Runner ready at: {now.strftime(\"%H:%M:%S\")} IST | Cron matched: {schedule!r}')

          # Determine shift from the cron expression that actually fired,
          # NOT from the current wall-clock hour. A delayed runner can land
          # outside every expected hour window, which used to silently
          # default to Shift A regardless of which cron triggered it.
          schedule_map = {
              '45 20 * * *':  ('C', 6, 30),
              '30 04 * * *':  ('A', 14, 30),
              '15 14 * * *': ('B', 22, 30),
          }

          if schedule in schedule_map:
              shift, target_hour, target_min = schedule_map[schedule]
          else:
              # Fallback only if the schedule context is missing entirely
              hour = now.hour
              if 5 <= hour < 13:
                  shift, target_hour, target_min = 'C', now.hour, now.minute
              elif 13 <= hour < 21:
                  shift, target_hour, target_min = 'A', now.hour, now.minute
              else:
                  shift, target_hour, target_min = 'B', now.hour, now.minute
              print(f'WARNING: schedule context not recognized ({schedule!r}); inferred shift {shift} from current time.')

          target_time = now.replace(hour=target_hour, minute=target_min, second=0, microsecond=0)

          # Only wait if we're a little early (normal case). If the runner
          # was delayed and we're already past the target, skip waiting
          # entirely and run immediately with the correct shift.
          wait_seconds = (target_time - datetime.now(IST)).total_seconds()
          if 0 < wait_seconds <= 120:
              print(f'Waiting {wait_seconds:.2f}s for exact trigger time ({target_hour:02d}:{target_min:02d}:00 IST)...')
              time.sleep(wait_seconds)
          elif wait_seconds > 120:
              print(f'Target time is unexpectedly far ahead ({wait_seconds:.0f}s) - running immediately without waiting.')
          else:
              print(f'Runner delayed by {-wait_seconds:.0f}s past target - running immediately for {shift} shift.')

          print(f'Triggering {shift} Shift Checklist at: {datetime.now(IST).strftime(\"%H:%M:%S\")} IST')
          subprocess.run(['python', 'script.py', '--shift', shift], check=True)
          "
