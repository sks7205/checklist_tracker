name: Shift Checklist Automation

on:
  schedule:
    # 06:30 AM IST (C Shift) -> 01:00 UTC
    - cron: '0 1 * * *'
    # 02:30 PM IST (A Shift) -> 09:00 UTC
    - cron: '0 9 * * *'
    # 10:30 PM IST (B Shift) -> 17:00 UTC
    - cron: '0 17 * * *'

  workflow_dispatch:
    inputs:
      shift:
        description: 'Select Shift (A, B, or C)'
        required: true
        type: choice
        options:
          - A
          - B
          - C
        default: 'A'
      date:
        description: 'Date in DD/MM/YYYY format (Leave empty for default)'
        required: false
        default: ''

jobs:
  run-checklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Execute Shift Checklist
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 1. If triggered manually (or via Cloudflare)
          if [ -n "${{ github.event.inputs.shift }}" ]; then
            SHIFT="${{ github.event.inputs.shift }}"
            DATE_ARG=""
            if [ -n "${{ github.event.inputs.date }}" ]; then
              DATE_ARG="--date ${{ github.event.inputs.date }}"
            fi
            python script.py --shift $SHIFT $DATE_ARG

          # 2. If triggered automatically on schedule (UTC hours: 01:00=C, 09:00=A, 17:00=B)
          else
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -eq "01" ] || [ "$UTC_HOUR" -eq "1" ]; then
              python script.py --shift C
            elif [ "$UTC_HOUR" -eq "09" ] || [ "$UTC_HOUR" -eq "9" ]; then
              python script.py --shift A
            elif [ "$UTC_HOUR" -eq "17" ]; then
              python script.py --shift B
            else
              python script.py
            fi
          fi
